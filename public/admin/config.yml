backend:
  name: github
  repo: robavionix/website
  branch: main

# Personal-site scale: this uses the built-in "Sign In with Token" method
# (GitHub personal access token, pasted at login) rather than a full OAuth
# app + relay worker. See https://sveltiacms.app/en/docs/backends/github#access-token
# -- that method is what Sveltia's own docs recommend when you (or a small
# technical team) are the only editor.

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

i18n:
  structure: multiple_folders
  locales: [english, chinese]
  default_locale: english

collections:
  - name: blog
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: src/content/blog
    create: true
    i18n: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - {
          label: "Description",
          name: description,
          widget: text,
          required: false,
          i18n: true,
        }
      - { label: "Date", name: date, widget: datetime, required: false }
      - {
          label: "Cover Image",
          name: image,
          widget: image,
          required: false,
          i18n: duplicate,
        }
      - { label: "Draft", name: draft, widget: boolean, default: false }
      - {
          label: "Categories",
          name: categories,
          widget: list,
          required: false,
          i18n: true,
        }
      - {
          label: "Tags",
          name: tags,
          widget: list,
          required: false,
          i18n: true,
        }
      - { label: "Body", name: body, widget: markdown, i18n: true }

  - name: blog_mdx
    label: "Blog Posts (MDX)"
    label_singular: "Blog Post (MDX)"
    folder: src/content/blog
    extension: mdx
    create: true
    i18n: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - {
          label: "Description",
          name: description,
          widget: text,
          required: false,
          i18n: true,
        }
      - { label: "Date", name: date, widget: datetime, required: false }
      - {
          label: "Cover Image",
          name: image,
          widget: image,
          required: false,
          i18n: duplicate,
        }
      - { label: "Draft", name: draft, widget: boolean, default: false }
      - {
          label: "Categories",
          name: categories,
          widget: list,
          required: false,
          i18n: true,
        }
      - {
          label: "Tags",
          name: tags,
          widget: list,
          required: false,
          i18n: true,
        }
      - {
          label: "Body",
          name: body,
          widget: code,
          output_code_only: true,
          default_language: "markdown",
          i18n: true,
          hint: "Raw MDX source, edited as plain text — this post uses JSX components (e.g. VideoInline, ImageList) that the rich-text Markdown widget could reformat or strip.",
        }

  - name: pages
    label: "Static Pages"
    label_singular: "Page"
    folder: src/content/pages
    create: false
    i18n: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - {
          label: "Meta Description",
          name: metaDescription,
          widget: text,
          required: false,
          i18n: true,
        }
      - { label: "Draft", name: draft, widget: boolean, default: false }
      - { label: "Body", name: body, widget: markdown, i18n: true }

  - name: curriculum
    label: "Curriculum Levels"
    label_singular: "Curriculum Level"
    folder: src/content/curriculum
    extension: mdx
    create: true
    i18n: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - {
          label: "Description",
          name: description,
          widget: text,
          required: false,
          i18n: true,
        }
      - { label: "Date", name: date, widget: datetime, required: false }
      - {
          label: "Cover Image",
          name: image,
          widget: image,
          required: false,
          i18n: duplicate,
        }
      - { label: "Draft", name: draft, widget: boolean, default: false }
      - {
          label: "Icon",
          name: icon,
          widget: string,
          required: false,
          i18n: duplicate,
          hint: "Lucide icon name, e.g. Gauge, Boxes, Zap, Waypoints, ShieldCheck",
        }
      - {
          label: "Level",
          name: level,
          widget: number,
          required: false,
          value_type: int,
          min: 1,
          max: 5,
          i18n: duplicate,
        }
      - {
          label: "Platform",
          name: platform,
          widget: select,
          required: false,
          options: ["quadrotor", "fixed-wing", "both"],
          i18n: duplicate,
        }
      - {
          label: "Target Stage",
          name: targetStage,
          widget: string,
          required: false,
          i18n: true,
        }
      - {
          label: "Math Prerequisite",
          name: mathPrereq,
          widget: string,
          required: false,
          i18n: true,
        }
      - {
          label: "Tier",
          name: tier,
          widget: select,
          required: false,
          options: ["core", "pro", "classroom"],
          i18n: duplicate,
        }
      - label: "Experiments"
        name: experiments
        widget: list
        required: false
        i18n: true
        fields:
          - { label: "Title", name: title, widget: string }
          - {
              label: "Description",
              name: description,
              widget: text,
              required: false,
            }
          - {
              label: "Platform (leave blank unless this level splits by airframe)",
              name: platform,
              widget: select,
              required: false,
              options: ["quadrotor", "fixed-wing"],
            }
      - { label: "Body", name: body, widget: markdown, i18n: true }

  - name: homepage
    label: "Homepage"
    label_singular: "Homepage Section"
    i18n: true
    files:
      - name: seo
        label: "Homepage SEO"
        file: "src/content/homepage/{{locale}}/-index.md"
        i18n: true
        fields:
          - {
              label: "Meta Description",
              name: metaDescription,
              widget: text,
              required: false,
              i18n: true,
            }

      - name: hero
        label: "Hero Banner"
        file: "src/content/sections/{{locale}}/banner-three.md"
        i18n: true
        fields:
          - {
              label: "Headline",
              name: title,
              widget: string,
              i18n: true,
              hint: "Supports <br/> for a manual line break.",
            }
          - {
              label: "Subheadline",
              name: description,
              widget: text,
              i18n: true,
            }
          - label: "Buttons"
            name: buttons
            widget: list
            i18n: true
            fields:
              - { label: "Button Text", name: label, widget: string }
              - {
                  label: "Link URL",
                  name: url,
                  widget: string,
                  required: false,
                }

      - name: skills
        label: "Feature Highlight"
        file: "src/content/sections/{{locale}}/startup-skill-section.md"
        i18n: true
        fields:
          - { label: "Title", name: title, widget: string, i18n: true }
          - { label: "Subtitle", name: subtitle, widget: text, i18n: true }
          - {
              label: "Description",
              name: description,
              widget: text,
              i18n: true,
            }
          - label: "Buttons"
            name: buttons
            widget: list
            i18n: true
            required: false
            fields:
              - { label: "Button Text", name: label, widget: string }
              - {
                  label: "Link URL",
                  name: url,
                  widget: string,
                  required: false,
                }
          - label: "List Items"
            name: listItems
            widget: list
            i18n: true
            required: false
            fields:
              - {
                  label: "Title",
                  name: title,
                  widget: string,
                  hint: "Supports <br/> for a manual line break.",
                }

      - name: process
        label: "How It Works"
        file: "src/content/sections/{{locale}}/working-process.md"
        i18n: true
        fields:
          - {
              label: "Title",
              name: title,
              widget: string,
              i18n: true,
              hint: "Supports <br/> for a manual line break.",
            }
          - label: "Steps"
            name: list
            widget: list
            i18n: true
            fields:
              - { label: "Step Title", name: title, widget: string }
              - {
                  label: "Step Description",
                  name: description,
                  widget: text,
                }

      - name: services
        label: "Curriculum Preview Section"
        file: "src/content/sections/{{locale}}/services-section.md"
        i18n: true
        fields:
          - {
              label: "Title",
              name: title,
              widget: string,
              i18n: true,
              hint: "Supports <br/> for a manual line break.",
            }
          - label: "Button"
            name: button
            widget: object
            i18n: true
            required: false
            fields:
              - { label: "Button Text", name: label, widget: string }
              - {
                  label: "Link URL",
                  name: url,
                  widget: string,
                  required: false,
                }

      - name: testimonial
        label: "Testimonials"
        file: "src/content/sections/{{locale}}/testimonial.md"
        i18n: true
        fields:
          - { label: "Title", name: title, widget: string, i18n: true }
          - label: "Quotes"
            name: list
            widget: list
            i18n: true
            required: false
            fields:
              - { label: "Quote", name: content, widget: text }
              - label: "Customer"
                name: customer
                widget: object
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Role", name: role, widget: string }

      - name: contact
        label: "Contact Section"
        file: "src/content/sections/{{locale}}/contact-section-two.md"
        i18n: true
        fields:
          - { label: "Title", name: title, widget: string, i18n: true }
          - {
              label: "Description",
              name: description,
              widget: text,
              i18n: true,
            }
          - {
              label: "Office Hours",
              name: officeHours,
              widget: string,
              i18n: true,
              required: false,
            }
          - label: "Contact Info"
            name: info
            widget: list
            i18n: true
            required: false
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }

      - name: team
        label: "Team / Founder Section"
        file: "src/content/sections/{{locale}}/team-section.md"
        i18n: true
        fields:
          - {
              label: "Title",
              name: title,
              widget: string,
              i18n: true,
              hint: "Supports <br/> for a manual line break.",
            }
          - label: "Button"
            name: button
            widget: object
            i18n: true
            required: false
            fields:
              - { label: "Button Text", name: label, widget: string }
              - {
                  label: "Link URL",
                  name: url,
                  widget: string,
                  required: false,
                }

      - name: blog_preview
        label: "Blog Preview Section"
        file: "src/content/sections/{{locale}}/blog-section.md"
        i18n: true
        fields:
          - { label: "Title", name: title, widget: string, i18n: true }
          - label: "Button"
            name: button
            widget: object
            i18n: true
            required: false
            fields:
              - { label: "Button Text", name: label, widget: string }
              - {
                  label: "Link URL",
                  name: url,
                  widget: string,
                  required: false,
                }
